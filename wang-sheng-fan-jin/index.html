<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../"><title>妄生梵烬</title>
<style>
body{margin:2rem auto;padding:0 1rem;max-width:56rem;background:#141414;color:#eee;font:1rem system-ui}
video{width:100%;background:#000;margin-top:1rem}
select{font:inherit;padding:.3rem}
#controls{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
#controls input{flex:1;min-width:0}
#controls button{font:inherit;padding:.35rem .5rem}
</style>
<main>
<h1>妄生梵烬</h1>
<label>集数 <select id="episode"></select></label>
<video id="player" disablepictureinpicture playsinline></video>
<div id="controls">
  <button type="button" id="toggle">播放</button>
  <input type="range" id="seek" min="0" max="0" value="0" step="0.1" aria-label="播放进度" disabled>
  <button type="button" id="mute">静音</button>
  <button type="button" id="fullscreen">全屏</button>
</div>
<p id="status" role="status"></p>
</main>
<script defer src="player-controls.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const video = document.querySelector('#player');
const episode = document.querySelector('#episode');
const status = document.querySelector('#status');
let hls;
function loadEpisode() {
  status.textContent = '';
  if (hls) hls.destroy();
  const url = new URL(episode.value + '/playlist.m3u8', document.baseURI).href;
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
  } else if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.attachMedia(video);
    hls.loadSource(url);
    hls.on(Hls.Events.ERROR, (_, error) => {
      if (error.fatal) status.textContent = '视频加载失败，请刷新页面后重试。';
    });
  } else {
    status.textContent = '此浏览器无法播放此视频。';
  }
}
video.addEventListener('error', () => {
  status.textContent = '视频加载失败，请刷新页面后重试。';
});
fetch(new URL('episodes.json', document.baseURI)).then(response => {
  if (!response.ok) throw new Error('Episode list unavailable');
  return response.json();
}).then(episodes => {
  for (const id of episodes) {
    episode.add(new Option('第 ' + Number(id.slice(2)) + ' 集', id));
  }
  episode.addEventListener('change', loadEpisode);
  loadEpisode();
}).catch(() => {
  status.textContent = '无法加载集数列表。';
});
</script>
